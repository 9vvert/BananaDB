[package]
name = "BananaDB"
version = "0.1.0"
rust-version = "1.74"
edition = "2021"

[dependencies]
bitmaps = {version="3.1.0", features = ["std"]}
bitvec = "1.0.1"
bytemuck = "1.14.0"
clap = { version = "4.5.6", features = ["derive"] }
hex = "0.4.3"
intrusive-collections = "0.9.6"
lalrpop = "0.20.2"
lalrpop-util = "0.20.2"
once_cell = "1.20.0"
serde = { version = "1.0.193", features = ["derive"]}
serde_json = "1.0.104"
thiserror = "1.0.50"
uuid = "1.4.1"
csv = "1.3.0"

[build-dependencies]
lalrpop = "0.20.2"
